name: PCI Import Daily

on:
  schedule:
    - cron: "20 4 * * *"
  workflow_dispatch:
    inputs:
      categories:
        description: "Categorias do PCI separadas por virgula"
        required: false
        default: ""
      max_pages:
        description: "Maximo de paginas por categoria"
        required: false
        default: "2"
      max_exams_per_category:
        description: "Maximo de provas por categoria"
        required: false
        default: "8"

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PCI_CATEGORIES: ${{ github.event.inputs.categories }}
      PCI_MAX_PAGES: ${{ github.event.inputs.max_pages != '' && github.event.inputs.max_pages || '2' }}
      PCI_MAX_EXAMS_PER_CATEGORY: ${{ github.event.inputs.max_exams_per_category != '' && github.event.inputs.max_exams_per_category || '8' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check -r packages/db/prisma/requirements-pci.txt

      - name: Generate Prisma Client
        run: corepack pnpm --filter @lexnexus/db generate

      - name: Run daily PCI import
        run: |
          if [ -n "$PCI_CATEGORIES" ]; then
            corepack pnpm --filter @lexnexus/db import:pci -- --categories "$PCI_CATEGORIES" --max-pages "$PCI_MAX_PAGES" --max-exams-per-category "$PCI_MAX_EXAMS_PER_CATEGORY" --trigger schedule
          else
            corepack pnpm --filter @lexnexus/db import:pci:daily -- --max-pages "$PCI_MAX_PAGES" --max-exams-per-category "$PCI_MAX_EXAMS_PER_CATEGORY" --trigger schedule
          fi
